<!DOCTYPE html>
<html>
<head>
    <title>Random Array</title>
</head>
<body>

    <h2 style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Random Array Generator</h2>

    <input type="text" id="arrayInput" placeholder="Generated array">

    <button style="background-color: navy; color: white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; padding: 4px;" onclick="generateArray()">Generate Array</button>

    <br><br>

    <input type="text" id="resultInput" placeholder="First and last elements">

    <button style="background-color: navy; color: white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; padding: 4px;" onclick="pickElements()">Pick Elements</button>

    <script src="script.js"></script>

</body>
</html>
